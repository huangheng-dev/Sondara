name: CI

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run qa:public-repo
      - run: npm run qa:ui-framework
      - run: npm run typecheck
      - run: npm run build
      - run: npm run qa:bundle-budget
      - run: npm run test:all
